<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>radarchart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Radar Chart</h1>
    <div>
  <canvas id="radarChart"></canvas>
    </div>  
</body>
<script>
class radarChart{
    constructor(canvasId = canvasId){
        this.canavasId = canvasId;
        this.dataUrl = dataUrl;
        this.chart = nill;
    }
    renderChart(data){
        const ctx = document.getElementsById(this.canvasId).getContext("2d");//instance

        this.chart = new chart(ctx,{
            type:"radar",
            data:{
                //Labels
                labels:Data.labels,
                //Datasets
                datasets: data.datasets
            },
            options:{
                responsive: true,
                plugins:{
                    legend:{
                        position:"top"
                    },
                    tittle:{
                        display:true,
                        text:"Radar Chart"
                    }
                },
                scales:{
                    anglelines:{display:true},
                    suggestedMin:0,
                    suggestedMax:100
                }
            }
            
        });
    }
    async fetchData(){
        try{
            const response = await fetch(this.dataUrl);
            if(!response.ok) throw new error(`Failed to Load data: ${response.statustext}`);

            const data = await response.json();
            return data;
        } catch(error){
            console.error("Error fetching data: ", error);
            return null;
        }
     }

     async init(){
        const data = await this.fetchData();
        if(data) this.renderChart(data);
        }
    }

    document.addEventListener("DOMContentLoaded", ()=>{
        const chart = new radarChart("radarCahrt", "radarData.json");
        chart.init();
    
    })
    

</script>
</html>
